name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sandboxd/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('sandboxd/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin

      - name: Build
        run: make build

      - name: Test
        run: make test

  # Go build, vet, and test for the CoreDNS plugin in networking/coredns-plugin/.
  # The plugin is otherwise only compiled incidentally inside the gateway image
  # docker build (integration job) — this job gives the Go code a fast,
  # dedicated CI gate so a build break or failing test reliably fails CI.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: networking/coredns-plugin/go.mod
          cache-dependency-path: networking/coredns-plugin/go.sum

      - name: Build
        run: go build ./...
        working-directory: networking/coredns-plugin

      - name: Vet
        run: go vet ./...
        working-directory: networking/coredns-plugin

      - name: Test
        run: go test ./...
        working-directory: networking/coredns-plugin

  # Shellcheck for the install / uninstall scripts and their shared engine.
  # All four scripts must pass POSIX-sh (`-s sh`) plus stylistic warnings
  # (`-S style`). `-x` enables cross-file source-following so shellcheck
  # can resolve variables that install.sh/uninstall.sh set and ui.sh reads
  # (and vice versa). The scripts themselves are not yet present in older
  # checkouts; until then the step short-circuits when none of the files
  # exist rather than failing CI.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Shellcheck
        run: |
          if [ -f scripts/install.sh ] || [ -f scripts/uninstall.sh ] || [ -f scripts/ui.sh ] || [ -f scripts/build.sh ]; then
            shellcheck -x -s sh -S style scripts/install.sh scripts/uninstall.sh scripts/ui.sh scripts/build.sh
          else
            echo "scripts/ not present yet; skipping."
          fi

  # Integration tests: every `integration_*`-prefixed test in the Rust
  # workspace. These require out-of-process state — a real gateway container,
  # a cap'd route helper binary, the `nft -c` / `envoy --mode validate` CLIs
  # shipped inside the gateway image, and Docker for the container-runtime
  # tests. The `make test-integration` target handles building the gateway
  # image, lite image, and cap'd route helper before running the suite.
  #
  # `sudo setcap` (used by `install-route-helper-test-cap`) requires root;
  # GitHub-hosted `ubuntu-latest` runners provide passwordless sudo. The
  # `libcap2-bin` package (setcap/getcap) is pre-installed on ubuntu-latest.
  integration:
    runs-on: ubuntu-latest
    needs: cargo
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sandboxd/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('sandboxd/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin

      - name: Install limactl
        run: |
          curl -fsSL https://github.com/lima-vm/lima/releases/download/v2.1.0/lima-2.1.0-Linux-x86_64.tar.gz \
            | sudo tar xzf - -C /usr/local --strip-components=1 ./bin/limactl
          limactl --version

      - name: Run integration tests
        run: make test-integration

  # PR-time + push-to-master: container backend only (~5-10 min).
  # Lite has no Lima/KVM dependency, so this job runs unmodified on stock
  # GitHub-hosted `ubuntu-latest` runners.
  e2e-container:
    if: false
    runs-on: ubuntu-latest
    needs: cargo
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sandboxd/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('sandboxd/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run container-only E2E suite
        run: make test-e2e-container

  # Merge-to-master: full matrix -- both backends (~30-45 min).
  #
  # The Lima half of the matrix requires `/dev/kvm` (nested virtualization),
  # which stock GitHub-hosted `ubuntu-latest` runners do NOT provide. The
  # job is therefore gated on a `[self-hosted, kvm]` runner label. Until
  # that runner is provisioned, the job will queue without scheduling and
  # the matrix coverage will not run on push-to-master.
  #
  # We deliberately do NOT silently degrade this job to container-only:
  # that would defeat the policy and lose the Lima coverage that the
  # matrix exists to preserve. See the CI policy section in
  # `docs/internal/milestones/M11.md` and the runner-provisioning handoff
  # in `.tasks/handoffs/`.
  e2e-matrix:
    if: false
    runs-on: [self-hosted, kvm]
    needs: cargo
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sandboxd/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('sandboxd/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run full-matrix E2E suite
        run: make test-e2e-matrix

  # macOS build + ad-hoc sign + macOS-specific checks.
  #
  # Runs on the stock `macos-14` runner (Apple Silicon). This lane:
  #   (a) Builds the Rust workspace for macOS.
  #   (b) Ad-hoc-signs every produced Mach-O binary. This is REQUIRED:
  #       AMFI (Apple Mobile File Integrity) SIGKILLs any unsigned arm64
  #       Mach-O at execve on macOS 14+, before Gatekeeper can prompt.
  #       The full Developer-ID signing + notarization pipeline is deferred
  #       to M22-S4; ad-hoc signing (`codesign -s -`) is sufficient for
  #       CI and local dev on the same machine.
  #   (c) Runs the D7 cross-language UUID equivalence check (Python vs Rust).
  #   (d) Runs the D4 macOS egress regression
  #       (test_macos_slirp_restrict_on_blocks_egress_after_gateway_route_deleted).
  #       NOTE: the D4 e2e test requires a running sandboxd daemon with the
  #       socket_vmnet pool, gateway Lima instance, and operator agent — all
  #       of which need `make setup-dev-env` on a persistent Apple-Silicon
  #       host. The stock `macos-14` runner is ephemeral and does NOT have
  #       the full sandboxd infrastructure. Until a persistent macOS runner
  #       is provisioned, the e2e step runs with `continue-on-error: true`
  #       and the infra-skip is surfaced as a warning rather than a hard
  #       failure. The full CI matrix (incl. this e2e) + Tart is deferred
  #       to M22-S4.
  #   (e) Runs the hermetic Rust tests (including verify_restrict_on
  #       negative tests) for macOS-specific code paths.
  #
  # The `build-macos` lane is the core-promise gate: it runs in CI on real
  # Apple Silicon as soon as M20 code exists, even before the persistent
  # macOS runner is provisioned for the full e2e.
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sandboxd/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('sandboxd/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/mac | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin

      - name: Build workspace (macOS)
        working-directory: sandboxd
        run: cargo build --workspace

      - name: Ad-hoc-sign all Mach-O binaries
        # AMFI SIGKILLs unsigned arm64 Mach-Os at execve on macOS 14+.
        # `codesign -s -` applies a local ad-hoc signature that satisfies
        # AMFI. The full Developer-ID signing pipeline is deferred to M22-S4.
        run: |
          find sandboxd/target/debug -maxdepth 1 -type f -perm +111 | while read bin; do
            if file "$bin" | grep -q 'Mach-O'; then
              codesign -s - --force "$bin" 2>/dev/null || true
            fi
          done

      - name: D7 — Cross-language UUID equivalence check
        # Verify the Python (Makefile plist generator) and Rust (network.rs)
        # vmnet slot network-identifier derivations produce identical UUIDs.
        # Divergence would silently break L2 inter-slot isolation.
        run: python3 scripts/check-vmnet-uuid-equivalence.py

      - name: Hermetic Rust tests (macOS paths)
        # Runs the full hermetic suite including macOS-specific tests:
        # verify_restrict_on negative tests, macos_session tests, etc.
        working-directory: sandboxd
        run: cargo nextest run --workspace

      - name: D4 — macOS egress regression (e2e, best-effort on ephemeral runner)
        # The full e2e requires a running sandboxd daemon + socket_vmnet pool
        # + gateway Lima instance + operator agent — infrastructure not present
        # on the ephemeral macos-14 runner. Until a persistent macOS runner is
        # provisioned (M22-S4), the test is skipped at the pytest level
        # (the _macos_required_for_macos_tests fixture checks for the agent).
        # continue-on-error: true so an infra-skip does not red the lane.
        continue-on-error: true
        run: |
          if [ -d tests/e2e ]; then
            cd tests/e2e
            python3 -m venv .venv
            .venv/bin/pip install -q -e .
            .venv/bin/python -m pytest test_networking.py::test_macos_slirp_restrict_on_blocks_egress_after_gateway_route_deleted -v --timeout=600
          else
            echo "tests/e2e not present; skipping macOS e2e"
          fi
