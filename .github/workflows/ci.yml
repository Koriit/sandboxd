name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sandboxd/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('sandboxd/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin

      - name: Build
        run: make build

      - name: Test
        run: make test

  # Go build, vet, and test for the CoreDNS plugin in networking/coredns-plugin/.
  # The plugin is otherwise only compiled incidentally inside the gateway image
  # docker build (integration job) — this job gives the Go code a fast,
  # dedicated CI gate so a build break or failing test reliably fails CI.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: networking/coredns-plugin/go.mod
          cache-dependency-path: networking/coredns-plugin/go.sum

      - name: Build
        run: go build ./...
        working-directory: networking/coredns-plugin

      - name: Vet
        run: go vet ./...
        working-directory: networking/coredns-plugin

      - name: Test
        run: go test ./...
        working-directory: networking/coredns-plugin

  # Shellcheck for the install / uninstall scripts, their shared engine, and
  # the vmnet drift checker. All must pass POSIX-sh (`-s sh`) plus stylistic
  # warnings (`-S style`). `-x` enables cross-file source-following so
  # shellcheck can resolve variables that install.sh/uninstall.sh set and
  # ui.sh reads (and vice versa). The scripts themselves are not yet present
  # in older checkouts; until then the step short-circuits when none of the
  # files exist rather than failing CI.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Shellcheck
        run: |
          if [ -f scripts/install.sh ] || [ -f scripts/uninstall.sh ] || [ -f scripts/ui.sh ] || [ -f scripts/build.sh ]; then
            shellcheck -x -s sh -S style scripts/install.sh scripts/uninstall.sh scripts/ui.sh scripts/build.sh
          else
            echo "scripts/ not present yet; skipping."
          fi

      - name: Shellcheck (vmnet drift checker)
        # Separate step because this script is macOS-only in what it calls
        # (`plutil`, `launchctl`) but is plain POSIX sh, so it lints on Linux.
        run: shellcheck -s sh -S style scripts/darwin-vmnet-drift.sh

  # Integration tests: every `integration_*`-prefixed test in the Rust
  # workspace. These require out-of-process state — a real gateway container,
  # a cap'd route helper binary, the `nft -c` / `envoy --mode validate` CLIs
  # shipped inside the gateway image, and Docker for the container-runtime
  # tests. The `make test-integration` target handles building the gateway
  # image, lite image, and cap'd route helper before running the suite.
  #
  # `sudo setcap` (used by `install-route-helper-test-cap`) requires root;
  # GitHub-hosted `ubuntu-latest` runners provide passwordless sudo. The
  # `libcap2-bin` package (setcap/getcap) is pre-installed on ubuntu-latest.
  integration:
    runs-on: ubuntu-latest
    needs: cargo
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sandboxd/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('sandboxd/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin

      - name: Install limactl
        run: |
          curl -fsSL https://github.com/lima-vm/lima/releases/download/v2.1.0/lima-2.1.0-Linux-x86_64.tar.gz \
            | sudo tar xzf - -C /usr/local --strip-components=1 ./bin/limactl
          limactl --version

      - name: Run integration tests
        run: make test-integration

  # PR-time + push-to-master: container backend only (~5-10 min).
  # Lite has no Lima/KVM dependency, so this job runs unmodified on stock
  # GitHub-hosted `ubuntu-latest` runners.
  e2e-container:
    if: false
    runs-on: ubuntu-latest
    needs: cargo
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sandboxd/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('sandboxd/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run container-only E2E suite
        run: make test-e2e-container

  # Merge-to-master: full matrix -- both backends (~30-45 min).
  #
  # The Lima half of the matrix requires `/dev/kvm` (nested virtualization),
  # which stock GitHub-hosted `ubuntu-latest` runners do NOT provide. The
  # job is therefore gated on a `[self-hosted, kvm]` runner label. Until
  # that runner is provisioned, the job will queue without scheduling and
  # the matrix coverage will not run on push-to-master.
  #
  # We deliberately do NOT silently degrade this job to container-only:
  # that would defeat the policy and lose the Lima coverage that the
  # matrix exists to preserve. See the runner-provisioning handoff
  # in `.tasks/handoffs/`.
  e2e-matrix:
    if: false
    runs-on: [self-hosted, kvm]
    needs: cargo
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sandboxd/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('sandboxd/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run full-matrix E2E suite
        run: make test-e2e-matrix

  # macOS build + ad-hoc sign + macOS-specific checks.
  #
  # Runs on the stock `macos-14` runner (Apple Silicon). This lane:
  #   (a) Builds the Rust workspace for macOS (native Mach-O binaries).
  #   (b) Ad-hoc-signs every produced Mach-O binary and verifies with
  #       `codesign -v`. This is REQUIRED: AMFI (Apple Mobile File
  #       Integrity) refuses to execve() any arm64 Mach-O that lacks a
  #       valid code signature — including ad-hoc ones — before Gatekeeper
  #       is consulted. strip(1) invalidates the linker-applied signature,
  #       so re-signing after any strip step is mandatory.
  #   (c) Runs the cross-language UUID equivalence check (Python vs Rust).
  #       Divergence between the two UUID derivations silently breaks L2
  #       inter-slot network isolation.
  #   (d) Runs the hermetic Rust test suite, including macOS-specific paths.
  #   (e) Runs the native macOS e2e suite (`make test-e2e-macos`) on a
  #       persistent Apple-Silicon runner with socket_vmnet + the full
  #       sandboxd infrastructure. The stock `macos-14` runner is ephemeral
  #       and does NOT have this infrastructure, so the step runs with
  #       `continue-on-error: true` until a persistent macOS runner is
  #       provisioned. The `make test-e2e-macos` target itself is wired by
  #       the macOS e2e harness milestone; the step is present now so the
  #       job structure is stable when that milestone lands.
  #   (f) Runs `make test-install-e2e` (Tart-based macOS install smoke).
  #       Also continue-on-error until Tart runner infrastructure is ready.
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sandboxd/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('sandboxd/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/mac | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin

      - name: Build workspace (macOS)
        working-directory: sandboxd
        run: cargo build --workspace

      - name: Ad-hoc-sign Mach-O binaries and verify
        # AMFI refuses to execve() unsigned arm64 Mach-Os on macOS 14+.
        # `codesign -s -` applies an ad-hoc signature; `codesign -v`
        # confirms the signature is valid post-sign. Both steps are
        # required — signing without verification does not catch failures.
        run: |
          find sandboxd/target/debug -maxdepth 1 -type f -perm +111 | while read bin; do
            if file "$bin" | grep -q 'Mach-O'; then
              codesign -s - --force "$bin"
              codesign -v "$bin"
            fi
          done

      - name: Cross-emitter vmnet plist equivalence check
        # Three code paths emit the vmnet LaunchDaemon plists — network.rs, the
        # Makefile, and scripts/install.sh — and nothing in any one language
        # ties them to the others. This compares the slot network-identifier
        # derivations, the daemon account name (including the account install.sh
        # actually creates), the staged binary path, and the pre-exec wrapper
        # template across all three.
        run: python3 scripts/check-vmnet-uuid-equivalence.py

      - name: Hermetic Rust tests (macOS paths)
        # Full hermetic suite including macOS-specific code paths.
        working-directory: sandboxd
        run: cargo nextest run --workspace

      - name: macOS e2e suite (best-effort on ephemeral runner)
        # `make test-e2e-macos` runs the native macOS e2e against real QEMU+HVF
        # sandbox VMs on a bare Apple-Silicon host — no nested virtualization.
        # The stock `macos-14` runner is ephemeral and lacks the full sandboxd
        # infrastructure (socket_vmnet pool, gateway Lima, operator agent).
        # continue-on-error: true until a persistent macOS runner is provisioned.
        continue-on-error: true
        run: make test-e2e-macos

      - name: Tart install smoke (best-effort)
        # `make test-install-e2e` runs the macOS install smoke via Tart VMs.
        # Requires Tart runner infrastructure; continue-on-error until available.
        continue-on-error: true
        run: make test-install-e2e
