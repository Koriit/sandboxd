[package]
name = "sandbox-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
enumset.workspace = true
nix = { version = "0.29", features = ["user"] }
notify = "6"
rcgen.workspace = true
ring.workspace = true
refinery.workspace = true
tempfile.workspace = true
time.workspace = true
rusqlite.workspace = true
sandbox-docker-argv.workspace = true
sandbox-invm-argv.workspace = true
schemars.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
ssh-key.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

# `getgrouplist(3)` is absent on Apple targets in nix 0.29, and it is the
# only membership lookup that sees an account whose *primary* gid is the
# group — which the daemon account's own record is. macOS-only because the
# call's signature differs from Linux's and nothing off macOS needs it.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
# serde_yaml: test-only. The gateway Lima template is validated structurally by
# `sandbox-agent` before it is written, and this crate's generator-side mirror
# test asserts the same properties against the live generator. Doing that by
# text inspection is what the older session-template mirror does, and it has
# already needed a carve-out for a `network:` key appearing inside a provision
# script's block scalar — a parse has no such problem. Dev-only: the shipped
# library gains no YAML dependency, and the enforcing validator stays in the
# agent, which deliberately does not depend on this crate.
serde_yaml = "0.9"

# Optional features.
#
# `test-env-override` — opts route-helper-side users.conf path resolution
# into honoring the `SANDBOX_USERS_CONF` environment variable. Default
# builds of the route-helper crate ignore the env var (production
# privilege boundary: a uid 0 file capability'd binary must not be
# redirectable to an attacker-controlled config file via a process-
# environment variable). The route-helper integration tests opt into the
# feature so they can drive the helper's authorization flow with a
# tempfile users.conf they own. The daemon-side load path
# (`users_conf_path()` / `load_users_config()`) is unaffected by this
# feature — the daemon is not the privilege boundary, only the cap'd
# helper is.
[features]
test-env-override = []
