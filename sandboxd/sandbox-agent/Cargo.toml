[package]
name = "sandbox-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "sandbox-agent"
path = "src/main.rs"

# Library target: exposes the broker wire-protocol types so the daemon can
# deserialize/serialize the same `BrokerRequest`/`BrokerResponse` messages
# without duplicating the definitions. Only the protocol and validation
# modules are public; the handler (agent-side limactl execution) is not.
[lib]
name = "sandbox_agent_protocol"
path = "src/lib.rs"

[features]
# `test-env-override` — opts the agent into honouring environment-variable
# seams used by unit and integration tests:
#
#   SANDBOX_AGENT_TEST_SANDBOX_GROUP — override the `_sandboxd` group name
#     so tests can drive the self-gate membership check against a synthetic
#     group without requiring the real `_sandboxd` group to exist.
#
#   SANDBOX_AGENT_TEST_BROKER_SOCKET — override the broker socket path so
#     tests can point the agent at a temp-dir socket without needing
#     /var/run or root privileges.
#
# Default (production) builds ignore all env vars. A non-privileged binary
# must not be redirectable via process environment variables.
test-env-override = []

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }

# libc is used only in the macOS implementation; the Linux stub main
# has no libc calls. Gated here so the macOS-only dep doesn't widen
# the Linux TCB unnecessarily (mirrors the route-helper / nft-logger
# gating pattern).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
# serde + serde_json: wire-protocol serialization (newline-delimited JSON frames
# over the broker channel). Scoped to macOS so the Linux stub remains dep-free.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# regex: VM-name and path validation on the agent side, mirroring the lima-helper.
regex = "1"
# sandbox-docker-argv: the `docker` argv fragments the agent builds are the same
# ones the daemon builds, so they come from one zero-dependency leaf crate
# rather than being formatted independently on each side. It is NOT
# `sandbox-core`: the agent's freedom from that dependency is the property the
# leaf crate exists to preserve (see its crate docs). Scoped to macOS with the
# rest of the agent's real dependencies — the Linux build is an inert stub.
sandbox-docker-argv = { workspace = true }
# serde_yaml: structural YAML parsing for lima.yaml shape validation. String-
# based line matching cannot reliably detect flow-style, quoted keys, or
# anchors/aliases — all reachable via a YAML serializer in a buggy daemon.
# Parsing to serde_yaml::Value normalises all serialisation styles so the
# shape assertions are robust by construction. Scoped to macOS (same TCB
# rationale as serde/serde_json above).
serde_yaml = "0.9"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true }
